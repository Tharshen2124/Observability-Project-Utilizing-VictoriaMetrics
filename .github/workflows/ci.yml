name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compose:
    name: Validate compose file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # compose.yml declares `env_file: .env`; the file is gitignored, so create
      # an empty one for config resolution without starting any service.
      - name: Create env file
        run: touch .env
      - name: Validate compose configuration
        run: docker compose config -q

  go:
    name: Build and vet Go module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...

  terraform:
    name: Validate terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate
