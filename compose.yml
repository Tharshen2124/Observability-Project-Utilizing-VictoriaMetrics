services:

  victoriametrics: 
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/storage
    command:
      - -storageDataPath=/storage
      # Keep metrics for 2 days
      - -retentionPeriod=2d
    restart: always
  
  # lgtm
  victorialogs: 
    image: victoriametrics/victoria-logs:latest
    ports:
      - "9428:9428"
    depends_on:
      - victoriametrics
    volumes:
      - vldata:/vlogs
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=2d

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    ports:
      - "9429:10428"
    depends_on:
      - victoriametrics
    volumes:
      - vtracesdata:/vtraces
    command:
      - -storageDataPath=/vtraces
      - -retentionPeriod=2d

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      # tells grafana where the VI and VM are. 
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml
      - grafana_data:/var/lib/grafana
    environment:
      # allow grafana to query visualise and interact with VictorialMetrics
      - "GF_INSTALL_PLUGINS=victoriametrics-logs-datasource,jaeger"
    depends_on:
      - victoriametrics 
      - victorialogs
      - victoriatraces

  opentelemetry:
    image: otel/opentelemetry-collector-contrib
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./config/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4318:4318"
    env_file:
      - .env

  # Data store for the `api` service. Data is persisted on the `pgdata`
  # volume; the container is not published to the host, only the compose
  # network can reach it.
  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # Scheduled logical backup of the `postgres` data onto the `pgbackups`
  # volume. See scripts/postgres-backup.sh.
  postgres-backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-backup.sh"]
    volumes:
      - ./scripts/postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
      - pgbackups:/backups
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-app}
      PGUSER: ${POSTGRES_USER:-app}
      PGPASSWORD: ${POSTGRES_PASSWORD:-app}
      BACKUP_INTERVAL_SECONDS: "86400"
      BACKUP_RETENTION_DAYS: "7"
    restart: always

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      opentelemetry:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      # Defaults to the compose `postgres` service. Set DATABASE_URL in .env
      # to point at an existing database instead.
      DATABASE_URL: ${DATABASE_URL:-postgres://app:app@postgres:5432/app?sslmode=disable}
    env_file:
      - .env

volumes:
  vmdata: {}
  vldata: {}
  vtracesdata: {}
  grafana_data: {}
  pgdata: {}
  pgbackups: {}
