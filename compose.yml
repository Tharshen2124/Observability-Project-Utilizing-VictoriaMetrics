services:

  victoriametrics: 
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    volumes:
      - vmdata:/storage
    command:
      - -storageDataPath=/storage
      # Keep metrics for 2 days
      - -retentionPeriod=2d
    restart: always
  
  # lgtm
  victorialogs: 
    image: victoriametrics/victoria-logs:latest
    ports:
      - "9428:9428"
    depends_on:
      - victoriametrics
    volumes:
      - vldata:/vlogs
    command:
      - -storageDataPath=/vlogs
      - -retentionPeriod=2d
    restart: always

  victoriatraces:
    image: victoriametrics/victoria-traces:latest
    ports:
      - "9429:10428"
    depends_on:
      - victoriametrics
    volumes:
      - vtracesdata:/vtraces
    command:
      - -storageDataPath=/vtraces
      - -retentionPeriod=2d
    restart: always

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      # tells grafana where the VI and VM are. 
      - ./config/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yaml
      - grafana_data:/var/lib/grafana
    environment:
      # allow grafana to query visualise and interact with VictorialMetrics
      - "GF_INSTALL_PLUGINS=victoriametrics-logs-datasource,jaeger"
    depends_on:
      - victoriametrics 
      - victorialogs
      - victoriatraces
    restart: always

  opentelemetry:
    image: otel/opentelemetry-collector-contrib
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./config/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4318:4318"
    env_file:
      - .env
    restart: always
    
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - opentelemetry
    env_file:
      - .env
    restart: always

  # Cloudflare Tunnel connector for the "homelab" tunnel
  # (77870e9c-3c57-497c-a206-b9bfaa78080b). It used to run as an ad-hoc process
  # outside this project, so a host reboot or a crashed connector could not be
  # recovered with `docker compose up -d`.
  #
  # The tunnel ingress is managed in the Cloudflare dashboard and targets the
  # host's published ports (http://localhost:<port>, ssh://localhost:22), so the
  # connector uses host networking to reach them. TUNNEL_TOKEN is read from .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: always
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - victoriametrics
      - victorialogs
      - victoriatraces
      - grafana
      - api

volumes:
  vmdata: {}
  vldata: {}
  vtracesdata: {}
  grafana_data: {}
